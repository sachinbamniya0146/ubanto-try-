name: Oracle Free Tier Instance Creation

on:
  schedule:
    # Run every 5 minutes (matches your watchdog cron)
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  oracle-retry:
    name: Oracle Free Tier Retry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Prevent concurrent runs - only one at a time
    concurrency:
      group: oracle-freetier-retry
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install OCI CLI and Python dependencies
        run: |
          pip install --upgrade pip
          pip install oci python-dotenv paramiko requests
          # Install OCI CLI for additional verification
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Decode and setup OCI config
        env:
          OCI_CONFIG_B64: ${{ secrets.OCI_CONFIG_B64 }}
          OCI_KEY_B64: ${{ secrets.OCI_KEY_B64 }}
        run: |
          set -euo pipefail
          decode_secret() {
            local name="$1" value="$2" out="$3"
            if [ -z "$value" ]; then
              echo "::error::Secret '$name' is empty or not set in repo Settings > Secrets and variables > Actions."
              exit 1
            fi
            # Strip whitespace/newlines the secret UI or copy-paste may have introduced,
            # then decode. --ignore-garbage tolerates stray non-base64 chars (e.g. trailing %).
            if ! printf '%s' "$value" | tr -d '[:space:]' | base64 -d --ignore-garbage > "$out"; then
              echo "::error::Secret '$name' is not valid base64. Re-encode the source file with: base64 -w 0 <file> and replace the secret value."
              exit 1
            fi
            if [ ! -s "$out" ]; then
              echo "::error::Decoded '$name' produced an empty file — the secret content is likely wrong."
              exit 1
            fi
          }
          mkdir -p ~/.oci
          decode_secret "OCI_CONFIG_B64" "$OCI_CONFIG_B64" ~/.oci/config
          decode_secret "OCI_KEY_B64" "$OCI_KEY_B64" ~/.oci/oci-keyfile.pem
          chmod 600 ~/.oci/config ~/.oci/oci-keyfile.pem

      - name: Setup SSH key
        env:
          SSH_PUB_B64: ${{ secrets.SSH_PUB_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "$SSH_PUB_B64" ]; then
            echo "::error::Secret 'SSH_PUB_B64' is empty or not set."
            exit 1
          fi
          if ! printf '%s' "$SSH_PUB_B64" | tr -d '[:space:]' | base64 -d --ignore-garbage > ~/.ssh/oracle_key.pub; then
            echo "::error::Secret 'SSH_PUB_B64' is not valid base64. Re-encode with: base64 -w 0 <file>."
            exit 1
          fi
          chmod 644 ~/.ssh/oracle_key.pub

      - name: Create oci.env
        env:
          OCI_ENV_B64: ${{ secrets.OCI_ENV_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$OCI_ENV_B64" ]; then
            echo "::error::Secret 'OCI_ENV_B64' is empty or not set."
            exit 1
          fi
          if ! printf '%s' "$OCI_ENV_B64" | tr -d '[:space:]' | base64 -d --ignore-garbage > oci.env; then
            echo "::error::Secret 'OCI_ENV_B64' is not valid base64. Re-encode with: base64 -w 0 <file>."
            exit 1
          fi

      - name: Run Oracle Instance Creation Script
        env:
          # Sensitive values passed as real GitHub Secrets (not hardcoded)
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Overrides whatever is in oci.env - retry every 50 seconds
          REQUEST_WAIT_TIME_SECS: "50"
        run: |
          # Run continuously for up to 4 minutes (leaving 1 min buffer before next scheduled run)
          timeout 240 python main.py

      - name: Check for Instance Created
        if: always()
        run: |
          if [ -f "INSTANCE_CREATED" ]; then
            echo "🎉 INSTANCE CREATED SUCCESSFULLY!"
            cat INSTANCE_CREATED
            # Create a summary for GitHub Actions UI
            echo "## Oracle Instance Created" >> $GITHUB_STEP_SUMMARY
            cat INSTANCE_CREATED >> $GITHUB_STEP_SUMMARY
          else
            echo "No instance created yet, will retry on next run"
          fi

      - name: Upload logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-logs-${{ github.run_id }}
          path: |
            *.log
            INSTANCE_CREATED
            UNHANDLED_ERROR.log
            images_list.json
          retention-days: 30
