name: Oracle Free Tier Instance Creation

on:
  schedule:
    # Odd-minute offsets (2,7,12,17...) to avoid GitHub throttling at :00 :05 :10
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  oracle-retry:
    name: Oracle Free Tier Retry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: oracle-freetier-retry
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install OCI CLI and Python dependencies
        run: |
          pip install --upgrade pip
          pip install oci python-dotenv paramiko requests
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Decode and setup OCI config
        env:
          OCI_CONFIG_B64: ${{ secrets.OCI_CONFIG_B64 }}
          OCI_KEY_B64: ${{ secrets.OCI_KEY_B64 }}
        run: |
          set -euo pipefail
          decode_secret() {
            local name="$1" value="$2" out="$3"
            if [ -z "$value" ]; then
              echo "::error::Secret '$name' is empty."
              exit 1
            fi
            if ! printf '%s' "$value" | tr -d '[:space:]' | base64 -d --ignore-garbage > "$out"; then
              echo "::error::Secret '$name' is not valid base64."
              exit 1
            fi
            if [ ! -s "$out" ]; then
              echo "::error::Decoded '$name' produced empty file."
              exit 1
            fi
          }
          mkdir -p ~/.oci
          decode_secret "OCI_CONFIG_B64" "$OCI_CONFIG_B64" ~/.oci/config
          decode_secret "OCI_KEY_B64" "$OCI_KEY_B64" ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
          echo "Key file first line:"
          head -1 ~/.oci/oci_api_key.pem
          echo "Config:"
          cat ~/.oci/config

      - name: Setup SSH key
        env:
          SSH_PUB_B64: ${{ secrets.SSH_PUB_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "$SSH_PUB_B64" ]; then
            echo "::error::SSH_PUB_B64 is empty."
            exit 1
          fi
          printf '%s' "$SSH_PUB_B64" | tr -d '[:space:]' | base64 -d --ignore-garbage > ~/.ssh/oracle_key.pub
          chmod 644 ~/.ssh/oracle_key.pub

      - name: Create oci.env
        env:
          OCI_ENV_B64: ${{ secrets.OCI_ENV_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$OCI_ENV_B64" ]; then
            echo "::error::OCI_ENV_B64 is empty."
            exit 1
          fi
          printf '%s' "$OCI_ENV_B64" | tr -d '[:space:]' | base64 -d --ignore-garbage > oci.env

      - name: Send Telegram "Starting" notification
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Auto-discover chat IDs and send start message
          python3 << 'PYEOF'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          if not token:
              exit(0)
          try:
              r = requests.get(f"https://api.telegram.org/bot{token}/getUpdates", timeout=10)
              data = r.json()
              chats = set()
              for u in data.get("result", []):
                  m = u.get("message") or u.get("edited_message") or u.get("channel_post")
                  if m and m.get("chat"):
                      chats.add(m["chat"]["id"])
              if not chats:
                  print("No chats yet. Send /start to bot once.")
                  exit(0)
              # Save chat IDs for next steps
              with open("tg_chats.txt", "w") as f:
                  f.write(",".join(str(c) for c in chats))
              from datetime import datetime
              msg = f"🔄 ARM retry run started at {datetime.utcnow().strftime('%H:%M UTC')}"
              for c in chats:
                  requests.post(f"https://api.telegram.org/bot{token}/sendMessage",
                      json={"chat_id": c, "text": msg, "disable_notification": True}, timeout=10)
              print(f"Sent start notification to {len(chats)} chat(s)")
          except Exception as e:
              print(f"Telegram notify error: {e}")
          PYEOF

      - name: Run Oracle Instance Creation Script
        id: run_script
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REQUEST_WAIT_TIME_SECS: "50"
        run: |
          timeout 240 python main.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Check for Instance Created
        if: always()
        id: check_instance
        run: |
          if [ -f "INSTANCE_CREATED" ]; then
            echo "🎉 INSTANCE CREATED!"
            cat INSTANCE_CREATED
            echo "## Oracle Instance Created" >> $GITHUB_STEP_SUMMARY
            cat INSTANCE_CREATED >> $GITHUB_STEP_SUMMARY
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "No instance this run"
            echo "status=no_capacity" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram "Finished" notification
        if: always() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STATUS: ${{ steps.check_instance.outputs.status }}
          SCRIPT_OUTCOME: ${{ steps.run_script.outcome }}
        run: |
          python3 << 'PYEOF'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          status = os.environ.get("STATUS", "unknown")
          outcome = os.environ.get("SCRIPT_OUTCOME", "unknown")
          if not token:
              exit(0)
          # Get cached chat IDs
          chats = []
          try:
              with open("tg_chats.txt") as f:
                  chats = [c.strip() for c in f.read().split(",") if c.strip()]
          except FileNotFoundError:
              # Re-discover
              try:
                  r = requests.get(f"https://api.telegram.org/bot{token}/getUpdates", timeout=10)
                  for u in r.json().get("result", []):
                      m = u.get("message") or u.get("edited_message")
                      if m and m.get("chat"):
                          chats.append(str(m["chat"]["id"]))
              except Exception:
                  pass
          if not chats:
              print("No chats to notify")
              exit(0)
          from datetime import datetime
          t = datetime.utcnow().strftime('%H:%M UTC')
          if status == "success":
              msg = f"✅ Run finished at {t} — Instance exists! Check previous messages for details."
              silent = False
          elif outcome == "success":
              msg = f"✓ Run finished at {t} — no capacity, will retry in 5 min"
              silent = True
          else:
              # script failed or timed out — expected during retry
              msg = f"⏳ Run ended at {t} — still trying for capacity (next attempt in 5 min)"
              silent = True
          for c in chats:
              try:
                  requests.post(f"https://api.telegram.org/bot{token}/sendMessage",
                      json={"chat_id": c, "text": msg, "disable_notification": silent}, timeout=10)
              except Exception as e:
                  print(f"send error: {e}")
          print(f"Sent finish notification: {msg}")
          PYEOF

      - name: Upload logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-logs-${{ github.run_id }}
          path: |
            *.log
            INSTANCE_CREATED
            UNHANDLED_ERROR.log
            images_list.json
          retention-days: 30
